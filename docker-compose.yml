services:
  backend:
    build: ./server
    container_name: backend
    restart: unless-stopped
    env_file:
      - ./server/.env
    ports:
      - "3000:3000"

  frontend:
    build: ./client
    container_name: frontend
    restart: unless-stopped
    env_file:
      - ./client/.env
    ports:
      - "5001:5001"
    depends_on:
      - backend
